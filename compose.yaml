name: hackalem-protokol
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wamigos}
      POSTGRES_USER: ${POSTGRES_USER:-wamigos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wamigos-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_KEEP_ALIVE: '0'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ollama]
    command: [pull, '${LOCAL_LLM_MODEL:-qwen3:4b-instruct}']
    depends_on:
      ollama:
        condition: service_healthy
  ai-service:
    build: ./ai-service
    environment:
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:4b-instruct}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-180}
      LOCAL_LLM_HEALTH_TIMEOUT_SECONDS: ${LOCAL_LLM_HEALTH_TIMEOUT_SECONDS:-3}
      LOCAL_LLM_MAX_TOKENS: ${LOCAL_LLM_MAX_TOKENS:-4096}
      LOCAL_LLM_MAX_INPUT_CHARS: ${LOCAL_LLM_MAX_INPUT_CHARS:-20000}
      ASR_MODEL: ${ASR_MODEL:-large-v3}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-speechbrain/spkrec-ecapa-voxceleb}
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cpu}
      DIARIZATION_SIMILARITY_THRESHOLD: ${DIARIZATION_SIMILARITY_THRESHOLD:-0.55}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-8}
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_XET: '1'
      SPEECH_RELEASE_MODELS_AFTER_RUN: ${SPEECH_RELEASE_MODELS_AFTER_RUN:-true}
    ports:
      - '127.0.0.1:${AI_PORT:-8000}:8000'
    volumes:
      - huggingface-cache:/models/huggingface
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wamigos}
      DB_USERNAME: ${POSTGRES_USER:-wamigos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wamigos-local}
      APP_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai-service:8000}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-5s}
      AI_RESPONSE_TIMEOUT: ${AI_RESPONSE_TIMEOUT:-25m}
      AI_HEALTH_TIMEOUT: ${AI_HEALTH_TIMEOUT:-3s}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8081}:8080'
    volumes:
      - meeting-files:/data/meetings
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/v3/api-docs]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8081}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
volumes:
  postgres-data:
  meeting-files:
  ollama-data:
  huggingface-cache:
